services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: huertos
      POSTGRES_USER: huertos
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-huertos}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huertos -d huertos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/huertos
      DATABASE_USERNAME: huertos
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-huertos}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
